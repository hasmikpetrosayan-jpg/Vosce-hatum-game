<iframe
width="100%"
height="850"
style="border:none;border-radius:20px;"
srcdoc='
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#4f46e5,#06b6d4);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

#goldenGame{
max-width:700px;
width:100%;
background:white;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
color:#4338ca;
font-size:32px;
margin-bottom:20px;
}

#question{
font-size:24px;
font-weight:bold;
color:#1e293b;
margin-bottom:20px;
}

.answer-btn{
margin:8px;
padding:14px;
width:90%;
border:none;
border-radius:12px;
cursor:pointer;
background:#e0e7ff;
font-size:18px;
font-weight:bold;
color:#312e81;
transition:.3s;
}

.answer-btn:hover{
background:#c7d2fe;
transform:scale(1.03);
}

#result{
font-size:22px;
font-weight:bold;
margin-top:15px;
}

#scoreBox{
margin-top:15px;
font-size:22px;
color:#0f172a;
}

#nextBtn{
display:none;
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:12px;
background:#10b981;
color:white;
font-size:18px;
cursor:pointer;
}

#nextBtn:hover{
background:#059669;
}
</style>
</head>

<body>

<div id="goldenGame">

<h2>✨ Ոսկե հատման խաղ ✨</h2>

<p id="question"></p>

<div id="answers"></div>

<p id="result"></p>

<div id="scoreBox">
🏆 Միավորներ՝ <span id="score">0</span>
</div>

<button id="nextBtn">Հաջորդ հարց ➜</button>

</div>

<script>

const questions=[
{
q:"Որքա՞ն է ոսկե հատման մոտավոր արժեքը",
a:["1.618","2.718","3.14","1.414"],
c:0
},
{
q:"Ո՞ր հաջորդականությունն է կապված ոսկե հատման հետ",
a:["Ֆիբոնաչի","Պասկալ","Նյուտոն","Գալիլեյ"],
c:0
},
{
q:"Ո՞ր ծաղկում է հաճախ հանդիպում ոսկե հատումը",
a:["Արևածաղիկ","Մանուշակ","Կակաչ","Վարդ"],
c:0
},
{
q:"Ոսկե հատումը նշանակվում է ո՞ր տառով",
a:["φ","π","β","δ"],
c:0
},
{
q:"Ո՞ր ոլորտում է կիրառվում ոսկե հատումը",
a:["Արվեստ","Ֆուտբոլ","Քիմիա","Աշխարհագրություն"],
c:0
}
];

let current=0;
let score=0;

const q=document.getElementById("question");
const a=document.getElementById("answers");
const r=document.getElementById("result");
const n=document.getElementById("nextBtn");

function loadQuestion(){

r.innerHTML="";
n.style.display="none";

q.innerHTML=questions[current].q;
a.innerHTML="";

questions[current].a.forEach((item,index)=>{

const btn=document.createElement("button");
btn.className="answer-btn";
btn.innerHTML=item;

btn.onclick=function(){

document.querySelectorAll(".answer-btn")
.forEach(x=>x.disabled=true);

if(index===questions[current].c){

r.innerHTML="✅ Ճիշտ պատասխան";
r.style.color="#16a34a";
score++;

}else{

r.innerHTML="❌ Սխալ պատասխան";
r.style.color="#dc2626";
}

document.getElementById("score").innerHTML=score;

n.style.display="inline-block";

};

a.appendChild(btn);

});

}

n.onclick=function(){

current++;

if(current<questions.length){

loadQuestion();

}else{

document.getElementById("goldenGame").innerHTML=
"<h2>🏆 Շնորհավորում ենք</h2>"+
"<h1>"+score+" / "+questions.length+"</h1>"+
"<p style=\"font-size:24px;color:#4f46e5;\">Դու հաջողությամբ անցար ոսկե հատման խաղը։</p>"+
"<button onclick=\"location.reload()\" style=\"padding:15px 30px;background:#10b981;color:white;border:none;border-radius:12px;font-size:18px;cursor:pointer;\">Սկսել նորից</button>";
}

}

loadQuestion();

</script>
</body>
</html>'
></iframe>
